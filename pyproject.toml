[project]
name = "capitalpilot"
version = "1.0.0"
description = "CapitalPilot — کنترل سرمایه، تصمیم هوشمندانه (مدیریت سرمایه‌گذاری شخصی، فارسی و راست‌به‌چپ)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.6",
  "jdatetime>=5.0",
  "tzdata",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
